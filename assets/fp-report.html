<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Function Point Analysis</title>
<style>
:root {
  --page: #f5f7fa; --surface: #ffffff; --surface-2: #f8fafc; --text: #1e293b; --muted: #64748b;
  --border: #e2e8f0; --accent: #4F46E5; --accent-soft: #eef2ff; --grad-a: #4F46E5; --grad-b: #7C3AED;
  --low: #047857; --low-bg: #ecfdf5; --avg: #a16207; --avg-bg: #fefce8; --high: #b91c1c; --high-bg: #fef2f2;
  --warn: #92400e; --warn-bg: #fffbeb; --warn-border: #fcd34d;
  --deferred: #b45309; --rejected: #9f1239; --notes: #4338ca;
  --c-ilf: #4F46E5; --c-eif: #0e7490; --c-ei: #047857; --c-eo: #b45309; --c-eiq: #be185d; --bar-base: #94a3b8;
  --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
  color-scheme: light;
}
body.dark {
  --page: #0f0f1a; --surface: #1a1a2e; --surface-2: #22223a; --text: #e2e8f0; --muted: #94a3b8;
  --border: #2e2e4a; --accent: #818CF8; --accent-soft: #26264a;
  --low: #6ee7b7; --low-bg: #0f2e25; --avg: #fde047; --avg-bg: #2e2a10; --high: #fca5a5; --high-bg: #3a1618;
  --warn: #fcd34d; --warn-bg: #2e2410; --warn-border: #78550f;
  --deferred: #fbbf24; --rejected: #fb7185; --notes: #a5b4fc;
  --c-ilf: #818CF8; --c-eif: #22d3ee; --c-ei: #34d399; --c-eo: #fbbf24; --c-eiq: #f472b6; --bar-base: #475569;
  --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.container { max-width: 960px; margin: 0 auto; padding: 4.5rem 1rem 3rem; }
.toolbar { position: fixed; top: .75rem; right: .75rem; display: flex; gap: .4rem; z-index: 10; }
.toolbar button { font: inherit; font-size: .8rem; padding: .35rem .75rem; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer; box-shadow: var(--shadow); }
.toolbar button:hover { border-color: var(--accent); }
button:focus-visible, [role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header.banner { background: linear-gradient(135deg, var(--grad-a), var(--grad-b)); color: #fff; border-radius: 16px;
  padding: 2rem 2rem 1.6rem; margin-bottom: 1.5rem; box-shadow: var(--shadow); }
header.banner h1 { margin: 0 0 .2rem; font-size: 1.7rem; line-height: 1.25; }
header.banner .subtitle { opacity: .85; font-size: .95rem; }
.badges { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
.badge { display: inline-block; font-size: .8rem; font-weight: 600; padding: .25rem .85rem; border-radius: 999px;
  background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .35); }
.card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.tabbar { display: flex; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.tabbar::-webkit-scrollbar { display: none; }
[role="tab"] { font: inherit; font-size: .9rem; white-space: nowrap; border: 0; background: none; color: var(--muted);
  padding: .8rem 1.1rem; cursor: pointer; border-bottom: 2px solid transparent; }
[role="tab"][aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
[role="tab"] .chip { font-size: .72rem; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: .05rem .5rem; margin-left: .35rem; }
.panel { padding: 1.75rem; }
.panel h2 { margin: 0 0 1rem; font-size: 1.25rem; }
.panel h3 { margin: 1.75rem 0 .6rem; font-size: 1.02rem; }
.panel p { margin: 0 0 1rem; }
.muted { color: var(--muted); }
.table-wrap { overflow-x: auto; margin: 0 0 1rem; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: .5rem .65rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: 0; }
td.rule { font-size: .82rem; color: var(--muted); white-space: nowrap; }
.pill { display: inline-block; font-size: .75rem; font-weight: 600; padding: .05rem .55rem; border-radius: 999px; }
.pill.Low { color: var(--low); background: var(--low-bg); }
.pill.Avg { color: var(--avg); background: var(--avg-bg); }
.pill.High { color: var(--high); background: var(--high-bg); }
.fid { font-size: .72rem; color: var(--muted); margin-left: .45rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.callout.info { border-color: var(--border); background: var(--surface-2); }
.flag { color: var(--warn); font-weight: 700; cursor: help; margin-left: .3rem; }
.ref { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.25rem; align-items: start; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 1.25rem; }
.ref table { font-size: .82rem; }
.ref td, .ref th { padding: .3rem .5rem; text-align: center; }
.ref .count { display: block; font-size: .7rem; color: var(--muted); }
.ref .weights { font-size: .85rem; line-height: 1.9; }
@media (max-width: 640px) { .ref { grid-template-columns: 1fr; } .panel { padding: 1.25rem; } }
.callout { border: 1px solid var(--warn-border); background: var(--warn-bg); color: var(--text); border-radius: 10px; padding: .9rem 1.1rem; margin-bottom: 1.5rem; }
.callout summary { cursor: pointer; font-weight: 600; color: var(--warn); }
.callout ul { margin: .6rem 0 0; padding-left: 1.2rem; font-size: .88rem; }
.callout p { margin: .5rem 0 0; font-size: .88rem; }
.chart { margin: .5rem 0 1.25rem; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: .35rem 1rem; font-size: .82rem; color: var(--muted); margin-top: .5rem; }
.legend i { display: inline-block; width: .8rem; height: .8rem; border-radius: 3px; margin-right: .35rem; vertical-align: -1px; }
.split2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; }
.calc { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.25rem; }
.calc .row { display: flex; justify-content: space-between; gap: 1rem; padding: .3rem 0; border-bottom: 1px dashed var(--border); }
.calc .row:last-child { border-bottom: 0; }
.calc .big { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
.squares { letter-spacing: .1em; color: var(--accent); white-space: nowrap; }
.squares .off { color: var(--border); }
.scope-block { border-left: 4px solid var(--accent); padding: .1rem 0 .1rem 1rem; margin-bottom: 1.5rem; }
.scope-block h3 { margin-top: 0; }
.scope-block.deferred { border-color: var(--deferred); } .scope-block.deferred h3 { color: var(--deferred); }
.scope-block.rejected { border-color: var(--rejected); } .scope-block.rejected h3 { color: var(--rejected); }
.scope-block.notes { border-color: var(--notes); } .scope-block.notes h3 { color: var(--notes); }
.scope-block ul { margin: 0; padding-left: 1.2rem; }
.scope-block.rejected li { color: var(--muted); }
.error { max-width: 640px; margin: 4rem auto; padding: 1.5rem; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
@media print {
  :root, body.dark {
    --page: #fff; --surface: #fff; --surface-2: #f8fafc; --text: #111827; --muted: #4b5563; --border: #d1d5db;
    --accent: #3730a3; --accent-soft: #eef2ff; --low: #065f46; --low-bg: #fff; --avg: #854d0e; --avg-bg: #fff; --high: #991b1b; --high-bg: #fff;
    --c-ilf: #1e1b4b; --c-eif: #155e75; --c-ei: #065f46; --c-eo: #92400e; --c-eiq: #831843; --bar-base: #9ca3af; --shadow: none;
    color-scheme: light;
  }
  body { background: #fff; font-size: 12px; }
  .container { max-width: none; padding: 0; }
  .toolbar, .tabbar { display: none !important; }
  .card, .callout, .ref, .calc { box-shadow: none; border-radius: 0; }
  header.banner { border-radius: 0; box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .chart, .pill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .panel, .panel[hidden] { display: block !important; padding: 1rem 0; }
  body.print-simple .panel:not(#panel-overview) { display: none !important; }
  .panel + .panel { break-before: page; }
  thead { display: table-header-group; }
  tr, .ref, .calc, .chart, .scope-block { break-inside: avoid; }
  .callout details > *:not(summary) { display: block; }
}
</style>
</head>

    ];
    if (count(cfpE)) recon.push(rrow(t('rCfp'), count(cfpE), '—', signed(CFP, '+')));
    recon.push(el('tr', { class: 'total' }, td(t('total')), td(''), td(t('updatedUfp') + ' ' + fmt(updatedUfp), 'num'), td(t('efp') + ' ' + fmt(EFP), 'num')));

    var perType = TYPES.map(function (type) {
      var a = baseF ? sumFp(baseF[type]) : 0;
      var b = updF ? sumFp(updF[type]) : a - sumFp(del[type]) - sumFp(chgE[type], function (e) { return e.before; })
        + sumFp(chgE[type], function (e) { return e.storedFp; }) + sumFp(addE[type], function (e) { return e.storedFp; });
      return { key: type, label: L.abbr[type], a: a, b: b };
    });
    tabs.push({ id: 'overview', label: t('overview'), nodes: [
      el('h3', { text: t('enhScope') }), el('p', { text: fpa.boundary || '' }),
      table([t('category'), { label: t('functions'), num: 1 }, { label: t('application'), num: 1 }, { label: t('project'), num: 1 }], recon),
      el('p', { class: 'muted', text: t('efpExplain') }),
      baseF ? groupedBars(perType) : null
    ] });

    function grouped(map, render) {
      return TYPES.filter(function (type) { return map[type].length; }).map(function (type) {
        return [el('h3', { text: L.abbr[type] + ' — ' + L.typeNames[type] }), render(type, map[type])];
      });
    }
    if (count(addE) || count(cfpE)) {
      var addNodes = grouped(addE, function (type, ev) { return itemTable(type, ev, true); });
      if (count(cfpE)) addNodes.push(el('h3', { text: t('conversion') }), el('p', { class: 'muted', text: t('conversionNote') }),
        grouped(cfpE, function (type, ev) { return itemTable(type, ev, true); }));
      tabs.push({ id: 'added', label: t('added'), chip: fmt(ADD + CFP), nodes: addNodes });
    }
    if (count(chgE)) {
      tabs.push({ id: 'changed', label: t('changed'), chip: fmt(CHGA), nodes: grouped(chgE, function (type, ev) {
        var rows = ev.map(function (e) {
          var d = (e.storedFp || 0) - e.before;
          return el('tr', null, nameCell(e), td(fmt(e.before), 'num'), td(e.rule || '—', 'rule'),
            td(pill(e.storedCx)), td(fmt(e.storedFp), 'num'), td(d > 0 ? '+' + fmt(d) : (d < 0 ? '−' + fmt(-d) : fmt(0)), 'num'));
        });
        return table([t('name'), { label: t('beforeFp'), num: 1 }, t('afterRule'), t('complexity'), { label: t('afterFp'), num: 1 }, { label: t('delta'), num: 1 }], rows);
      }) });
    }
    if (count(del)) {
      tabs.push({ id: 'deleted', label: t('deleted'), chip: fmt(DEL), nodes: grouped(del, function (type, items) {
        return table([t('name'), { label: t('baselineFp'), num: 1 }], items.map(function (it) { return el('tr', null, nameCell(it), td(fmt(num(it.fp)), 'num')); }));
      }) });
    }
    if (afpRes) tabs.push({ id: 'afp', label: t('afpTab'), nodes: afpRes.nodes });
    var effort = [];
    if (fpa.effort) effort.push(el('div', { class: 'split2' }, effortBlock(fpa, t('efp'), EFP), efpAdj != null ? effortBlock(fpa, t('efpAdj'), efpAdj) : null), effortSource(fpa));
    effort.push(assumptionsBlock(fpa));
    if (fpa.effort || list(fpa.assumptions).length) tabs.push({ id: 'effort', label: t('effortTab'), nodes: effort });
    if (scopeCount(fpa)) tabs.push({ id: 'scope', label: t('scopeTab'), chip: fmt(scopeCount(fpa)), nodes: scopePanel(fpa) });

    var badges = [t('efp') + ' ' + fmt(EFP), t('updatedUfp') + ' ' + fmt(updatedUfp)];
    if (afpRes) badges.push(t('afp') + ' ' + fmt(afpRes.afp));
    return { title: t('reportEnh'), badges: badges, tabs: tabs };
  }

  // ── Page shell, tabs, theme, print ─────────────────────────────────────
  function render(payload) {
    var fpa = payload.fpa || payload;
    LANG = payload.lang || document.documentElement.lang || 'en';
    var base = I18N[LANG] || I18N[LANG.split('-')[0]] || I18N.en;
    L = Object.assign({}, I18N.en, base, payload.labels || {});
    L.typeNames = Object.assign({}, I18N.en.typeNames, base.typeNames, (payload.labels || {}).typeNames);
    L.abbr = Object.assign({}, I18N.en.abbr, base.abbr, (payload.labels || {}).abbr);
    try { NF = new Intl.NumberFormat(LANG, { maximumFractionDigits: 0 }); NF2 = new Intl.NumberFormat(LANG, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    catch (e) { NF = new Intl.NumberFormat('en', { maximumFractionDigits: 0 }); NF2 = new Intl.NumberFormat('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    document.documentElement.lang = LANG;

    var report = fpa.project_type === 'enhancement' ? buildEnh(fpa) : buildDev(fpa);
    document.title = (fpa.system || report.title) + ' — ' + report.title;

    var app = document.getElementById('app');
    app.appendChild(el('header', { class: 'banner' },
      el('h1', { text: fpa.system || report.title }),
      el('div', { class: 'subtitle', text: report.title + (fpa.date ? ' · ' + fmtDate(fpa.date) : '') }),
      el('div', { class: 'badges' }, report.badges.map(function (b) { return el('span', { class: 'badge', text: b }); }))));

    if (issues.length) {
      report.tabs[0].nodes.unshift(el('div', { class: 'callout' }, el('details', { open: issues.length <= 5 },
        el('summary', { text: '⚠ ' + t('checks', { n: issues.length }) }), el('p', { text: t('checksIntro') }),
        el('ul', null, issues.map(function (s) { return el('li', { text: s }); })))));
    }

    var tabbar = el('div', { class: 'tabbar', role: 'tablist' });
    var card = el('div', { class: 'card' }, tabbar);
    report.tabs.forEach(function (tab) {
      tabbar.appendChild(el('button', { type: 'button', role: 'tab', id: 'tab-' + tab.id, 'aria-controls': 'panel-' + tab.id, 'data-tab': tab.id },
        tab.label, tab.chip != null ? el('span', { class: 'chip', text: tab.chip }) : null));
      card.appendChild(el('section', { class: 'panel', role: 'tabpanel', id: 'panel-' + tab.id, 'aria-labelledby': 'tab-' + tab.id, tabindex: 0 },
        el('h2', { text: tab.title || tab.label }), tab.nodes));
    });
    app.appendChild(card);

    var tabButtons = Array.prototype.slice.call(tabbar.querySelectorAll('[role="tab"]'));
    function select(id, focus) {
      if (!document.getElementById('panel-' + id)) id = report.tabs[0].id;
      tabButtons.forEach(function (b) {
        var on = b.getAttribute('data-tab') === id;
        b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1;
        document.getElementById('panel-' + b.getAttribute('data-tab')).hidden = !on;
        if (on && focus) b.focus();
      });
      if (history.replaceState) history.replaceState(null, '', '#' + id);
    }
    tabbar.addEventListener('click', function (e) { var b = e.target.closest('[role="tab"]'); if (b) select(b.getAttribute('data-tab')); });
    tabbar.addEventListener('keydown', function (e) {
      var i = tabButtons.indexOf(document.activeElement); if (i < 0) return;
      var next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabButtons.length - 1 }[e.key];
      if (next == null) return;
      e.preventDefault();
      select(tabButtons[(next + tabButtons.length) % tabButtons.length].getAttribute('data-tab'), true);
    });
    select(location.hash.slice(1) || report.tabs[0].id);

    // Theme: light | dark | auto (follows the OS). Custom accents are optional.
    var style = payload.style || {};
    var dark = style.theme === 'dark' || (style.theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var THEME_KEY = 'fp-control-theme';
    try { var saved = localStorage.getItem(THEME_KEY); if (saved) dark = saved === 'dark'; } catch (e) { /* storage unavailable */ }
    var btnTheme = document.getElementById('btn-theme');
    function applyTheme(isDark) {
      document.body.classList.toggle('dark', isDark);
      btnTheme.textContent = isDark ? t('light') : t('dark');
      var accent = isDark ? (style.accent_dark || style.accent) : style.accent;
      if (accent) document.body.style.setProperty('--accent', accent); else document.body.style.removeProperty('--accent');
    }
    if (style.accent) {
      document.body.style.setProperty('--grad-a', style.accent);
      document.body.style.setProperty('--grad-b', style.accent_2 || 'color-mix(in srgb, ' + style.accent + ', #000 30%)');
    }
    applyTheme(dark);
    btnTheme.addEventListener('click', function () {
      dark = !dark; applyTheme(dark);
      try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch (e) { /* storage unavailable */ }
    });

    // Print always in light mode; "Summary" prints the Overview tab only.
    window.addEventListener('beforeprint', function () { applyTheme(false); });
    window.addEventListener('afterprint', function () { applyTheme(dark); document.body.classList.remove('print-simple'); });
    var btnPrint = document.getElementById('btn-print'), btnSummary = document.getElementById('btn-summary');
    btnPrint.textContent = t('print'); btnSummary.textContent = t('summary');
    btnPrint.addEventListener('click', function () { window.print(); });
    btnSummary.addEventListener('click', function () { document.body.classList.add('print-simple'); window.print(); });
    document.getElementById('toolbar').hidden = false;
  }

  function fail(msg) {
    document.getElementById('app').appendChild(el('div', { class: 'error' }, el('strong', { text: 'fp-control' }), el('p', { text: msg })));
  }
  document.addEventListener('DOMContentLoaded', function () {
    L = I18N.en;
    var node = document.getElementById('fpa-data');
    if (!node) return fail(t('noData'));
    var payload;
    try { payload = JSON.parse(node.textContent); } catch (e) { return fail(t('badData', { msg: e.message })); }
    try { render(payload); } catch (e) { fail(String(e && e.stack || e)); }
  });
})();
</script>
